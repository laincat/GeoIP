name: 同步到 cnb.cool

# 任何 main 提交都同步到 CNB 镜像，独立于 Build workflow。
# 这样文档 / 配置 / 代码的改动也不会漏同步。

on:
  schedule:
    # 每天一次兜底，防止某次 push 事件丢失后两边长期不一致
    - cron: "17 22 * * *"
  workflow_dispatch:
  push:
    branches: [main]
  # Build 工作流用 GITHUB_TOKEN 自动 push release 分支，不会触发别的 workflow，
  # 所以监听它完成后跑一次，把文档/产物之外的代码同步过去。
  workflow_run:
    workflows: ["Build Country.mmdb"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: sync-cnb
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
      CNB_USER: ${{ secrets.CNB_USER }}
      CNB_REPO: laincat/GeoIP

    steps:
      - name: 取出仓库
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 同步到 cnb.cool（直接推 main 历史；没配 secret 就跳过）
        if: ${{ env.CNB_TOKEN != '' }}
        shell: bash
        run: |
          set -euxo pipefail
          # 两边都用 main，直接 force-push main，history 完全一致。
          CRED='!f() { echo "username='"${CNB_USER}"'"; echo "password='"${CNB_TOKEN}"'"; }; f'
          git -c credential.helper= -c credential.helper="$CRED" \
              push --force "https://cnb.cool/${CNB_REPO}.git" HEAD:main
          echo "已镜像到 cnb.cool/${CNB_REPO}（main 指向 $(git rev-parse --short HEAD)）"

      # 把 GitHub Release 的附件镜像到 CNB Release：那边 releases 页面此前一直
      # 是空的（同步只推分支历史，从不建 Release）。CNB 没有 releases/latest
      # 别名，所以沿用固定 tag `geoip`，靠覆盖同名附件换稳定直链。
      - name: 镜像 Release 附件到 cnb.cool
        if: ${{ env.CNB_TOKEN != '' }}
        shell: bash
        env:
          CNB_REPO_SLUG: ${{ env.CNB_REPO }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: geoip
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub 侧还没有 $TAG Release，本轮跳过附件镜像"
            exit 0
          fi
          STAGE="$RUNNER_TEMP/cnb-assets"
          mkdir -p "$STAGE"
          gh release download "$TAG" --dir "$STAGE" --clobber
          echo "待镜像附件 $(find "$STAGE" -type f | wc -l) 个"
          python tools/publish_cnb_release.py --files-dir "$STAGE" --tag "$TAG" --ttl 0

      - name: 未配置 secret（跳过）
        if: ${{ env.CNB_TOKEN == '' }}
        shell: bash
        run: |
          echo "CNB_TOKEN 未配置，跳过同步"
