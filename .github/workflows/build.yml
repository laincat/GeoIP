name: Build Country.mmdb

on:
  workflow_dispatch:

  schedule:
    # 北京时间每天 04:30（UTC 20:30）
    - cron: "30 20 * * *"

  push:
    branches:
      - master
    paths-ignore:
      - "*.md"
      - "LICENSE*"
      - ".gitignore"
      - ".github/dependabot.yml"

# 写权限是**两个**动作的前提，缺一不可：
#   ① 推 release 分支（jsDelivr 那条链路）
#   ② 创建 GitHub Release 并上传附件（releases/latest/download 那条链路）
# 注意：这里的权限只能收窄、不能提权，所以仓库的
# Settings -> Actions -> General -> Workflow permissions
# 也必须设为 "Read and write"，否则两者都会 403。
permissions:
  contents: write

concurrency:
  group: build-country-mmdb
  cancel-in-progress: false

env:
  # 校验工具固定版本，**不要**用 @latest：
  #   - @latest 每天可能指到不同代码，"同一提交重跑得到同一结果"就不成立了
  #   - 缓存 key 也会因此天天失效，等于没缓存
  MMDBVERIFY_VERSION: v1.0.0

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ./go.mod
          cache-dependency-path: ./go.sum

      # setup-go 只缓存 GOMODCACHE（依赖**下载**），不管 GOCACHE（依赖**编译**）。
      # 后者才是 go build 的主要耗时，单独缓存一层。
      - name: Cache Go build cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: gocache-${{ runner.os }}-${{ hashFiles('go.sum', '**/*.go') }}
          restore-keys: |
            gocache-${{ runner.os }}-

      # mmdbverify 是个纯命令行工具，装一次能用很久。
      # 缓存整个 ~/go/bin，配合上面固定的 MMDBVERIFY_VERSION 做 key：
      # 版本不变就是缓存命中，`go install` 直接变空操作。
      - name: Cache Go installed tools
        uses: actions/cache@v6
        with:
          path: ~/go/bin
          key: gobin-${{ runner.os }}-mmdbverify-${{ env.MMDBVERIFY_VERSION }}

      - name: Set variables
        run: |
          set -euo pipefail

          # 固定 mmdb 的 build_epoch，使同一输入产出字节级一致的文件。
          # 取「当前修订的提交时间」而非「现在」，这样重跑同一个提交
          # 不会改变产物校验和（reproducible-builds 的标准做法）。
          echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

          # ── Release 用**固定 tag**，不再每版一个 tag ──────────────────────
          # 原来是 TAG_NAME=$(date -u +%Y%m%d%H%M)，于是每天 2 次构建就多出
          # 2 个 tag + 2 个 release，几年下来 tags 页面堆了 1409 个（2026-09-17
          # 实测）。改成固定 tag 后：release 只有唯一一个，每次构建**覆盖同名
          # 附件**（`softprops/action-gh-release` 的 `overwrite_files` 默认就是
          # true），`releases/latest/download/<file>` 依旧永远指向最新一版。
          # ⇒ 「一版一地址」变成「一个地址，内容滚动」。
          echo "RELEASE_TAG=geoip" >> "$GITHUB_ENV"

          # 构建时间戳仍然要留着 —— 但只作为「版本号」写进 version 文件
          # 与 Release 正文，不再当 tag 用。
          echo "BUILD_STAMP=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_ENV"
        shell: bash

      # 下载逻辑收敛在 scripts/fetch-data.sh 里，README 的本地构建命令调的是
      # 同一个脚本 —— 原先这段 curl 在 README 与 workflow 里各写了一遍，
      # 改路径要改两处，判据也容易悄悄漂移。
      # 脚本自带「体积下限 + gzip 完整性」双重校验：IPInfo 取数失败会返回
      # HTTP 200 + 一小段错误正文，只看状态码分辨不出来。
      - name: Download input data
        env:
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
        run: bash ./scripts/fetch-data.sh

      - name: Build Country.mmdb
        run: |
          set -euo pipefail
          go build -o ./geoip ./cmd/geoip
          ./geoip convert -c ./config.json
          ls -l ./output

      - name: Check reproducibility
        run: |
          set -euo pipefail

          # 同一输入必须产出同一字节流，否则说明 build_epoch 之类的
          # 非确定性因素溜进来了（曾经唯一的差异源就是它）。
          cp ./output/Country.mmdb ./output/Country.mmdb.first
          ./geoip convert -c ./config.json

          if ! cmp -s ./output/Country.mmdb.first ./output/Country.mmdb; then
            echo "::error::两次构建产物不一致，SOURCE_DATE_EPOCH 未生效"
            cmp -l ./output/Country.mmdb.first ./output/Country.mmdb | head -20
            exit 1
          fi

          rm -f ./output/Country.mmdb.first
          echo "✅ 可复现：两次构建字节完全一致（$(stat -c%s ./output/Country.mmdb) 字节）"

      - name: Verify mmdb structure
        run: |
          set -euo pipefail
          go install -v "github.com/maxmind/mmdbverify@${MMDBVERIFY_VERSION}"
          "$(go env GOPATH)/bin/mmdbverify" -file ./output/Country.mmdb

      - name: Smoke test lookups
        run: |
          set -euo pipefail
          python3 -m pip install --quiet "maxminddb==2.6.1"
          python3 ./scripts/verify_mmdb.py ./output/Country.mmdb

      - name: Cross-check against IPInfo source
        run: |
          set -euo pipefail

          # mmdbverify 只验二进制结构，verify_mmdb.py 只抽查几个固定 IP。
          # 这一步按固定步长抽样三万个源区间逐点回查，要求每个答案都能由
          # 「IPInfo 源文件」或「config.json 的 overwriteList」解释。
          python3 ./scripts/verify_mmdb_vs_source.py ./output/Country.mmdb --csv ./data/ipinfo/country.csv.gz

      - name: Generate checksum
        run: |
          set -euo pipefail
          cd ./output
          sha256sum Country.mmdb > Country.mmdb.sha256sum
          printf '%s\n' "${BUILD_STAMP}" > version
          cat Country.mmdb.sha256sum
          cat version

      # 空跑短路：产物与线上已发布的那份**逐字节相同**时，后面三步发布动作
      # 全都没有意义。这在「改了 workflow/文档后 push」的场景下是常态 ——
      # 每次都会重新构建出同一个文件，然后白白覆盖一次 Release、多推一个
      # release 分支提交、多刷一次 jsDelivr。
      #
      # 取不到已发布的校验和（首次运行、网络抖动、release 被删）时一律按
      # 「有变化」处理 —— 短路是优化，绝不能变成漏发的原因。
      - name: Detect no-op build
        id: delta
        run: |
          set -uo pipefail

          new_sum=$(cut -d' ' -f1 ./output/Country.mmdb.sha256sum)
          published=$(curl -fsSL --max-time 30 --retry 2 \
            "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/Country.mmdb.sha256sum" \
            2>/dev/null | awk '{print $1}')

          echo "本次构建:  ${new_sum}"
          echo "线上已发布: ${published:-（取不到，按有变化处理）}"

          if [ -n "${published}" ] && [ "${new_sum}" = "${published}" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "✅ 与已发布版本逐字节相同 → 跳过发布、跳过 jsDelivr 刷新"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
            echo "ℹ️ 产物有变化 → 正常发布"
          fi

      # 产物有两个去处，互不冲突：
      #   ① release 分支 —— 供 jsDelivr 走 cdn.jsdelivr.net 分发。该分支是
      #      「干净目录 git init + 孤立 + force-push」，永远只有 1 个提交，
      #      仓库不会因为每天重建而膨胀。
      #   ② GitHub Release 附件 —— 见下一步。附件**不占 git 仓库**，且
      #      `releases/latest/download/<file>` 是永远指向最新一版的固定地址，
      #      也不受 jsDelivr 的 20MB 单文件限制（本产物约 14.7MB，贴着上限）。
      - name: Push assets to release branch
        if: steps.delta.outputs.skip != '1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd ./output

          git init -q
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b release
          git add -A
          git commit -q -m "${BUILD_STAMP}"

          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin release

      # 发布 GitHub Release。
      #
      # 为什么之前 releases 页面是空的：上面那步只做了 `git push release`，
      # 从头到尾没调用过 Releases API —— 推分支 ≠ 建 Release，两者是独立的
      # 东西。Releases API 生成的 Release 对象才带附件和 releases/latest 指针。
      #
      # tag 是**固定**的 `geoip`（见 Set variables 的说明），不是每版一个。
      # release 已存在时本 action 会**更新**它；附件同名会被覆盖
      # （`overwrite_files` 默认 true）。于是 releases 页面永远只有一条，
      # tags 页面只有一个 tag，下游地址也恒定：
      #     https://github.com/laincat/GeoIP/releases/latest/download/Country.mmdb
      #
      # 注意这一步**不依赖** release 分支：附件直接来自 ./output 里的文件。
      # 不再需要 release 分支时删掉上一步即可，本步照常工作。
      #
      # 另：上一步在 ./output 里 git init 过，所以这里必须逐个列文件名，
      # 不能用 `output/*` 之类的通配（会把 ./output/.git 也扫进来）。
      - name: Publish GitHub Release
        if: steps.delta.outputs.skip != '1'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: GeoIP 产物（滚动更新）
          body: |
            Country.mmdb —— GeoLite2-Country 结构 + 类别覆盖（CLOUDFLARE / GOOGLE /
            TELEGRAM / NETFLIX / PRIVATE / CN 等），由 IPInfo 免费 country.csv 与
            iptoasn.com 构建。

            本 Release 的 tag 固定为 `geoip`，**每次构建覆盖同名附件** ——
            所以这里永远只有一条 Release、一个 tag，内容滚动更新。
            （旧的历史 tag 已于 2026-09-17 清理。）

            固定下载地址（永远指向最新一版）：

            https://github.com/laincat/GeoIP/releases/latest/download/Country.mmdb

            当前版本：`${{ env.BUILD_STAMP }}`

            | 文件 | 说明 |
            |---|---|
            | `Country.mmdb` | 产物本体 |
            | `Country.mmdb.sha256sum` | 校验和，用法见仓库 README |
            | `version` | 构建时间戳（UTC，`YYYYMMDDHHMM`） |
          files: |
            output/Country.mmdb
            output/Country.mmdb.sha256sum
            output/version
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true

      # 兜底清理：万一将来又出现了非固定 tag 的 release/tag（人为误建、
      # 或历史遗留），在这里顺手清掉，保证「只保留最新」是一条**保证**
      # 而不是一种期望。整步失败不阻断 —— 清理失败不该拖垮产物发布。
      - name: Prune stale releases and tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          # ① 非固定 tag 的 release（连同其 tag 一起删）
          gh release list --limit 200 --json tagName --jq '.[].tagName' 2>/dev/null \
            | while read -r t; do
                [ -z "$t" ] && continue
                [ "$t" = "${RELEASE_TAG}" ] && continue
                echo "删除旧 release: $t"
                gh release delete "$t" --yes --cleanup-tag 2>/dev/null || true
              done

          # ② 没有 release 的历史 tag。
          # ⚠️ 这里**不能**用 `--paginate`：/git/refs/tags 不支持分页，
          #    永远返回全量，--paginate 会无限翻页。
          gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags" \
               --jq '.[].ref' 2>/dev/null \
            | sed 's#^refs/tags/##' \
            | while read -r t; do
                [ -z "$t" ] && continue
                [ "$t" = "${RELEASE_TAG}" ] && continue
                echo "删除旧 tag: $t"
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/$t" 2>/dev/null || true
              done

          echo "剩余 tag："
          gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags" --jq '.[].ref' 2>/dev/null || true
        continue-on-error: true

      - name: Purge jsDelivr cache
        if: steps.delta.outputs.skip != '1'
        run: |
          # jsDelivr 对超过 20MB 的文件会直接 403，此时刷新失败属正常，
          # 不影响主产物，所以这里不让它中断流程。
          for file in Country.mmdb Country.mmdb.sha256sum version; do
            curl -sS -o /dev/null -w "purge ${file}: %{http_code}\n" \
              "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@release/${file}" || true
          done
