name: Build Country.mmdb

on:
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * *"
  push:
    branches: [main]
    paths-ignore: ["*.md", "LICENSE*", ".gitignore", ".github/dependabot.yml"]

permissions:
  contents: read

concurrency:
  group: build-country-mmdb
  cancel-in-progress: false

env:
  MMDBVERIFY_VERSION: v1.0.0
  RELEASE_TAG: geoip

jobs:
  build:
    name: Build and verify (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ./go.mod
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Regression tests
        run: |
          python3 -m pip install --quiet -r requirements-ci.txt
          python3 -m unittest discover -s scripts -p 'test_*.py'
          go test -race ./...
          go vet ./...
      - name: Set reproducible epoch
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      - name: Download input data
        env:
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
        run: bash ./scripts/fetch-data.sh
      - name: Snapshot and validate service inputs
        run: python3 scripts/source_snapshot.py snapshot
      - name: Build all four products
        run: |
          set -euo pipefail
          go build -o ./geoip ./cmd/geoip
          ./geoip convert -c ./config.snapshot.json
          ./geoip convert -c ./config-asn.json
          bash scripts/build-geosite.sh
      - name: Verify all-product reproducibility from frozen inputs
        run: |
          set -euo pipefail
          (cd output && sha256sum Country.mmdb geoip.dat GeoLite2-ASN.mmdb geosite.dat) > "$RUNNER_TEMP/first.sha256sum"
          ./geoip convert -c ./config.snapshot.json
          ./geoip convert -c ./config-asn.json
          bash scripts/build-geosite.sh --reuse-inputs
          (cd output && sha256sum -c "$RUNNER_TEMP/first.sha256sum")
      - name: Verify both MMDB structures
        run: |
          set -euo pipefail
          go install "github.com/maxmind/mmdbverify@${MMDBVERIFY_VERSION}"
          "$(go env GOPATH)/bin/mmdbverify" -file output/Country.mmdb
          "$(go env GOPATH)/bin/mmdbverify" -file output/GeoLite2-ASN.mmdb
      - name: Verify independent content and rule semantics
        run: |
          set -euo pipefail
          python3 scripts/verify_mmdb.py output/Country.mmdb
          python3 scripts/verify_mmdb_vs_source.py output/Country.mmdb --config config.snapshot.json
          python3 scripts/verify_products.py
      - name: Generate complete manifests
        run: |
          set -euo pipefail
          python3 scripts/source_snapshot.py manifest
          cd output
          sha256sum Country.mmdb > Country.mmdb.sha256sum
          sha256sum Country.mmdb geoip.dat GeoLite2-ASN.mmdb geosite.dat > artifacts.sha256sum
          date -u +%Y%m%d%H%M > version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-products
          path: output/
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish verified products
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-products
          path: output
      - name: Verify transfer and read version
        run: |
          set -euo pipefail
          (cd output && sha256sum -c artifacts.sha256sum && sha256sum -c Country.mmdb.sha256sum)
          echo "BUILD_STAMP=$(cat output/version)" >> "$GITHUB_ENV"
      - name: Detect no-op across every published product
        id: delta
        run: python3 scripts/release_delta.py "$GITHUB_REPOSITORY" output >> "$GITHUB_OUTPUT"

      - name: Push assets to release branch
        if: steps.delta.outputs.skip != '1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd ./output

          git init -q
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b release
          git add -A
          git commit -q -m "${BUILD_STAMP}"

          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin release

      # 发布 GitHub Release。
      #
      # 为什么之前 releases 页面是空的：上面那步只做了 `git push release`，
      # 从头到尾没调用过 Releases API —— 推分支 ≠ 建 Release，两者是独立的
      # 东西。Releases API 生成的 Release 对象才带附件和 releases/latest 指针。
      #
      # tag 是**固定**的 `geoip`（见 Set variables 的说明），不是每版一个。
      # release 已存在时本 action 会**更新**它；附件同名会被覆盖
      # （`overwrite_files` 默认 true）。于是 releases 页面永远只有一条，
      # tags 页面只有一个 tag，下游地址也恒定：
      #     https://github.com/laincat/GeoIP/releases/latest/download/Country.mmdb
      #
      # 注意这一步**不依赖** release 分支：附件直接来自 ./output 里的文件。
      # 不再需要 release 分支时删掉上一步即可，本步照常工作。
      #
      # 另：上一步在 ./output 里 git init 过，所以这里必须逐个列文件名，
      # 不能用 `output/*` 之类的通配（会把 ./output/.git 也扫进来）。
      - name: Publish GitHub Release
        if: steps.delta.outputs.skip != '1'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: GeoIP 产物（滚动更新）
          body: |
            GeoIP 四格式产物，同一份 IP 数据 + 域名数据，覆盖 mihomo / Surge /
            Clash / sing-box 的 `geoip`、`mmdb`、`asn`、`geosite` 四种字段。

            本 Release 的 tag 固定为 `geoip`，**每次构建覆盖同名附件** ——
            所以这里永远只有一条 Release、一个 tag，内容滚动更新。
            （旧的历史 tag 已于 2026-09-17 清理。）

            当前版本：`${{ env.BUILD_STAMP }}`

            | 文件 | 对应字段 | 说明 |
            |---|---|---|
            | `Country.mmdb` | mihomo `mmdb` / Surge GEOIP | 国家码 + 服务类别（CLOUDFLARE / GOOGLE / TELEGRAM / NETFLIX / CN 等） |
            | `geoip.dat` | mihomo `geoip`（v2ray 容器） | 同源 IP 数据的 v2ray GeoIP 格式 |
            | `GeoLite2-ASN.mmdb` | mihomo `asn` | iptoasn 全量 ASN（`autonomous_system_number` + 组织名） |
            | `geosite.dat` | mihomo `geosite` | 域名数据（category-ai / ozon / advertising），来自 laincat/Rules |
            | `artifacts.sha256sum` | — | 上述四个产物的校验和 |
            | `inputs.json` | — | 输入快照哈希、Rules 与编译器版本 |
            | `version` | — | 构建时间戳（UTC，`YYYYMMDDHHMM`） |

            固定下载地址（永远指向最新一版，把文件名换成任意产物即可）：

            https://github.com/laincat/GeoIP/releases/latest/download/Country.mmdb
          files: |
            output/Country.mmdb
            output/Country.mmdb.sha256sum
            output/geoip.dat
            output/GeoLite2-ASN.mmdb
            output/geosite.dat
            output/artifacts.sha256sum
            output/inputs.json
            output/version
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true

      # 兜底清理：万一将来又出现了非固定 tag 的 release/tag（人为误建、
      # 或历史遗留），在这里顺手清掉，保证「只保留最新」是一条**保证**
      # 而不是一种期望。整步失败不阻断 —— 清理失败不该拖垮产物发布。
      - name: Prune stale releases and tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          # ① 非固定 tag 的 release（连同其 tag 一起删）
          gh release list --limit 200 --json tagName --jq '.[].tagName' 2>/dev/null \
            | while read -r t; do
                [ -z "$t" ] && continue
                [ "$t" = "${RELEASE_TAG}" ] && continue
                echo "删除旧 release: $t"
                gh release delete "$t" --yes --cleanup-tag 2>/dev/null || true
              done

          # ② 没有 release 的历史 tag。
          # ⚠️ 这里**不能**用 `--paginate`：/git/refs/tags 不支持分页，
          #    永远返回全量，--paginate 会无限翻页。
          gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags" \
               --jq '.[].ref' 2>/dev/null \
            | sed 's#^refs/tags/##' \
            | while read -r t; do
                [ -z "$t" ] && continue
                [ "$t" = "${RELEASE_TAG}" ] && continue
                echo "删除旧 tag: $t"
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/$t" 2>/dev/null || true
              done

          echo "剩余 tag："
          gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags" --jq '.[].ref' 2>/dev/null || true
        continue-on-error: true

      - name: Purge jsDelivr cache
        if: steps.delta.outputs.skip != '1'
        run: |
          # jsDelivr 对超过 20MB 的文件会直接 403，此时刷新失败属正常，
          # 不影响主产物，所以这里不让它中断流程。
          for file in Country.mmdb Country.mmdb.sha256sum version; do
            curl -sS -o /dev/null -w "purge ${file}: %{http_code}\n" \
              "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@release/${file}" || true
          done

