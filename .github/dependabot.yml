# Daily dependency checks; patch/minor merge only after validation.
# Major updates remain separate for compatibility review.
version: 2
updates:
- package-ecosystem: gomod
  directory: /
  schedule:
    interval: daily
    time: 09:00
    timezone: Asia/Shanghai
  open-pull-requests-limit: 5
  groups:
    go-minor-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  commit-message:
    prefix: chore
    include: scope
  labels:
  - dependencies
  assignees:
  - laincat
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: daily
    time: 09:00
    timezone: Asia/Shanghai
  open-pull-requests-limit: 5
  groups:
    github-actions:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  commit-message:
    prefix: ci
  labels:
  - dependencies
  assignees:
  - laincat
- package-ecosystem: pip
  directory: /
  schedule:
    interval: daily
    time: 09:00
    timezone: Asia/Shanghai
  groups:
    python-minor-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  commit-message:
    prefix: chore
